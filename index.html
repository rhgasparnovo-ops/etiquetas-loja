const AUTH_KEY_JWT = 'balcao_jwt';
const AUTH_KEY_USER = 'balcao_jwt_user';
const CLIENT_ID = '268940510478-ko2qq87rmqsa1vn9qq8uci5aq50ofvvi.apps.googleusercontent.com';

let _currentUser = null;

function parseJwt(token){
  try{
    const b = String(token).split('.')[1]; if(!b) return null;
    const s = b.replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(atob(s).split('').map(function(c){
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join('')));
  }catch(e){ return null; }
}

function getStoredToken(){
  try{ return localStorage.getItem(AUTH_KEY_JWT) || null; }catch(e){ return null; }
}

function sessaoAindaValida(){
  return !!getStoredToken();
}

function setStoredToken(token){
  try{
    const i = parseJwt(token) || {};
    localStorage.setItem(AUTH_KEY_JWT, token);
    const u = { email: i.email || '', name: i.name || '', picture: i.picture || '' };
    localStorage.setItem(AUTH_KEY_USER, JSON.stringify(u));
    _currentUser = u;
  }catch(e){}
}

function clearStoredToken(){
  try{
    localStorage.removeItem(AUTH_KEY_JWT);
    localStorage.removeItem(AUTH_KEY_USER);
  }catch(e){}
  _currentUser = null;
}

function atualizarUICredenciais(){
  const card = document.getElementById('authCard');
  const t = document.getElementById('authTitle');
  const s = document.getElementById('authSub');
  const ic = document.getElementById('authIcon');
  if(!card || !t || !s || !ic) return;

  if(sessaoAindaValida()){
    const info = _currentUser || {};
    card.classList.add('logged');
    t.textContent = 'Sessão';
    s.textContent = info.email || info.name || 'Conectado';
    ic.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  } else {
    card.classList.remove('logged');
    t.textContent = 'Sessão';
    s.textContent = 'Entrar';
    ic.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3H9z"/></svg>';
  }
}

window.handleCredentialResponse = function(response){
  if(!response || !response.credential) return;
  setStoredToken(response.credential);
  atualizarUICredenciais();
  try{ toast('Sessão iniciada com sucesso!','success'); }catch(e){}
  carregarTudo({skipCache: true});
};

function fazerLogout(){
  clearStoredToken();
  atualizarUICredenciais();

(function setupPWA(){
  const isAndroid = /Android/i.test(navigator.userAgent);
  const isMobileUA = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const isFile = location.protocol === 'file:';
  let dp = null, modalAberto = false;
  const banner = document.getElementById('installBanner');
  const bannerBtn = document.getElementById('installBannerBtn');
  const bannerClose = document.getElementById('installBannerClose');
  if(isStandalone){ if(banner) banner.remove(); return; }
  if(!isAndroid || !isMobileUA || isFile){ if(banner) banner.remove(); return; }
  let mostrarTimer = null, esconderTimer = null;
  const VISIVEL_MS = 25000;
  const INTERVALO_MS = 300000;
  const SILENCIADO_KEY = 'balcao_install_silence';
  let silenciadoAte = 0;
  try{ silenciadoAte = parseInt(localStorage.getItem(SILENCIADO_KEY) || '0', 10) || 0; }catch(e){}

  function mostrarTemporariamente(){
    if(!banner) return;
    if(Date.now() < silenciadoAte) return;
    banner.classList.remove('closing');
    banner.classList.add('show');
    if(esconderTimer) clearTimeout(esconderTimer);
    esconderTimer = setTimeout(function(){
      esconderBanner();
      if(mostrarTimer) clearTimeout(mostrarTimer);
      mostrarTimer = setTimeout(mostrarTemporariamente, INTERVALO_MS);
    }, VISIVEL_MS);
  }
  function esconderBanner(){
    if(!banner) return;
    banner.classList.add('closing');
    setTimeout(function(){ banner.classList.remove('show','closing'); }, 320);
  }
  function silenciarPor30min(){
    try{ localStorage.setItem(SILENCIADO_KEY, String(Date.now() + 30 * 60 * 1000)); }catch(e){}
  }
  function ocultarDefinitivamente(){
    if(mostrarTimer) clearTimeout(mostrarTimer);
    if(esconderTimer) clearTimeout(esconderTimer);
    if(banner) banner.remove();
  }

  let swOk = false;
  if('serviceWorker' in navigator && isSecure){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      swOk = regs.some(function(r){ return r.active && r.active.scriptURL.indexOf('sw.js') !== -1; });
    }).catch(function(){});
  }
  setTimeout(mostrarTemporariamente, 2000);
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); dp = e;
    if(Date.now() >= silenciadoAte) mostrarTemporariamente();
  });
  window.addEventListener('appinstalled', function(){
    dp = null; ocultarDefinitivamente();
    try{ toast('Aplicação instalada!','success'); }catch(e){}
  });
  if(bannerClose){
    bannerClose.addEventListener('click', function(){
      silenciarPor30min(); esconderBanner();
      if(mostrarTimer) clearTimeout(mostrarTimer);
      if(esconderTimer) clearTimeout(esconderTimer);
    });
  }
  function db(){
    const ua = navigator.userAgent || '';
    if(/SamsungBrowser/i.test(ua)) return 'samsung';
    if(/EdgA|EdgiOS|Edg\//i.test(ua)) return 'edge';
    if(/OPR|Opera/i.test(ua)) return 'opera';
    if(/Firefox|FxiOS/i.test(ua)) return 'firefox';
    return 'chrome';
  }
  function instr(){
    if(db() === 'samsung'){
      return {t:'📲 Instalar no Samsung Internet',s:'Pelo menu do Samsung Internet.',p:[
        {n:'1',t:'Menu <kbd>☰</kbd>',d:'Canto inferior direito.'},
        {n:'2',t:'"Adicionar página a"',d:'Ou "Adicionar à página inicial".'},
        {n:'3',t:'"Ecrã inicial"',d:'Confirme.'},
        {n:'4',t:'Pronto',d:'Fica no ecrã inicial.'}
      ]};
    }
    return {t:'📲 Instalar no Android',s:'Chrome / Edge / Firefox.',p:[
      {n:'1',t:'Menu <kbd>⋮</kbd>',d:'Canto superior direito.'},
      {n:'2',t:'"Instalar aplicação"',d:'Ou "Adicionar ao ecrã principal".'},
      {n:'3',t:'Confirmar',d:'Toque em "Instalar".'},
      {n:'4',t:'Pronto',d:'Abre pelo ícone.'}
    ]};
  }
  function abrirModal(){
    if(modalAberto) return; modalAberto = true;
    const i = instr();
    document.getElementById('installTitle').textContent = i.t;
    document.getElementById('installSub').textContent = i.s;
    document.getElementById('installSteps').innerHTML = i.p.map(function(x){
      return '<div class="install-step"><div class="install-step-num">'+x.n+'</div><div class="install-step-text"><strong>'+x.t+'</strong><span>'+x.d+'</span></div></div>';
    }).join('');
    const tr = document.getElementById('installTry');
    if(tr){ tr.style.display = dp ? '' : 'none'; if(dp) tr.textContent = '⬇️ Instalar agora'; }
    document.getElementById('installModal').classList.add('show');
  }
  if(bannerBtn) bannerBtn.addEventListener('click', function(e){
    e.preventDefault();
    if(dp){
      dp.prompt();
      dp.userChoice.then(function(c){
        if(c.outcome === 'accepted'){ toast('A instalar…','success'); ocultarDefinitivamente(); }
        else { setTimeout(abrirModal, 300); }
        dp = null;
      }).catch(abrirModal);
    } else abrirModal();
  });
  document.addEventListener('click', function(e){
    if(e.target.id === 'installClose' || e.target.id === 'installModal'){
      document.getElementById('installModal').classList.remove('show'); modalAberto = false;
    }
    if(e.target.id === 'installTry'){
      if(dp){ dp.prompt(); dp.userChoice.then(function(){ dp = null; document.getElementById('installModal').classList.remove('show'); modalAberto = false; }); }
      else { document.getElementById('installModal').classList.remove('show'); modalAberto = false; }
    }
  });
  if('serviceWorker' in navigator && isSecure){
    navigator.serviceWorker.register('sw.js',{scope:'./'}).then(function(){ swOk = true; }).catch(function(){});
  }
})();

  if(!p) return p;

  o.product = o.product || o.nome || "";

const TOAST_ICONS = {success: "✓", error: "✕", warning: "!", info: "i"};
let _lastToastMsg = "", _lastToastTime = 0;
function toast(msg, type, duration){
  if(!msg) return;
  type = (type || "info").toLowerCase();
  const now = Date.now();
  if(msg === _lastToastMsg && (now - _lastToastTime) < 2000) return;
  _lastToastMsg = msg; _lastToastTime = now;
  duration = duration || (type === "error" ? 5500 : type === "warning" ? 4500 : 3200);
  const c = document.getElementById("toastContainer"); if(!c) return;
  const el = document.createElement("div");
  el.className = "toast " + type; el.setAttribute("role","alert");
  el.innerHTML = '<span class="toast-icon">' + (TOAST_ICONS[type] || "•") + '</span><span class="toast-body"></span><button class="toast-close" type="button" aria-label="Fechar">✕</button>';
  el.querySelector(".toast-body").textContent = msg;
  let dismissed = false;
  function d(){ if(dismissed) return; dismissed = true; el.classList.remove("show"); setTimeout(function(){ if(el.parentNode) el.remove(); }, 320); }
  el.querySelector(".toast-close").addEventListener("click", d);
  c.appendChild(el); requestAnimationFrame(function(){ el.classList.add("show"); }); setTimeout(d, duration);
}

let _statusTimer = null;
function setStatus(msg, type, opts){
  const el = document.getElementById("appStatus"); if(!el) return;
  opts = opts || {};
  if(_statusTimer){ clearTimeout(_statusTimer); _statusTimer = null; }
  if(!msg){ el.textContent = ""; el.classList.remove("show"); el.removeAttribute("data-type"); return; }
  type = type || "info"; el.textContent = msg; el.setAttribute("data-type", type); el.classList.add("show");
  if(type === "success" || type === "info"){
    _statusTimer = setTimeout(function(){
      if(el.textContent === msg){ el.classList.remove("show"); el.removeAttribute("data-type"); }
    }, opts.duration || 3200);
  }
}

    }

      b.onclick = function(){ tipoSel = b.dataset.tipo; at(); if(input.value.trim()) input.focus(); };
    });
    input.oninput = at; at(); modal.classList.add("show");
    setTimeout(function(){ if(input.value.trim()){ input.focus(); input.select(); } }, 60);
    function fechar(r){
      modal.classList.remove("show"); confirmBtn.onclick = null;
      document.getElementById("saveBancoCancel").onclick = null;
      input.onkeydown = null; input.oninput = null; modal.onclick = null;
      boxTipo.querySelectorAll("button").forEach(function(b){ b.onclick = null; });

    confirmBtn.onclick = function(){
      const v = (input.value || "").trim().toUpperCase();
      if(!v){ toast("Escreva um nome.","warning"); input.focus(); return; }
      if(tipoSel !== "fruta" && tipoSel !== "legume"){ toast("Escolha Fruta ou Legume.","warning"); return; }

    input.onkeydown = function(e){

function escapeHTML(s){
  return String(s || "").replace(/[&<>"']/g, function(m){
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[m];
  });
}

function thumbUrl(id, size){

function extrairFotoIdDoUrl(url){
  if(!url || url.indexOf('http') !== 0) return '';
  let m = String(url).match(/\/d\/([^=\/?#]+)/); if(m) return m[1];
  m = String(url).match(/[?&]id=([^&=]+)/); return m ? m[1] : '';
}

function compressSmart(dataUrl, maxSize, quality){
  maxSize = maxSize || IMG_MAX_SIZE; quality = quality || IMG_QUALITY;
  return new Promise(function(resolve){
    const img = new Image(); img.crossOrigin = "anonymous";
    img.onload = function(){
      try{
        let w = img.width, h = img.height;
        if(w > maxSize || h > maxSize){
          if(w > h){ h = Math.round(h * maxSize / w); w = maxSize; }
          else { w = Math.round(w * maxSize / h); h = maxSize; }
        }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); let t = false;
        try{
          const tmp = document.createElement('canvas'); tmp.width = Math.min(w, 80); tmp.height = Math.min(h, 80);
          const tc = tmp.getContext('2d'); tc.drawImage(img, 0, 0, tmp.width, tmp.height);
          const px = tc.getImageData(0, 0, tmp.width, tmp.height).data;
          for(let i = 3; i < px.length; i += 4){ if(px[i] < 250){ t = true; break; } }
        }catch(e){}
        if(t){
          ctx.clearRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
          let out = c.toDataURL('image/webp', quality);
          if(out.indexOf('image/webp') === -1) out = c.toDataURL('image/png');
          resolve(out);
        } else {
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', quality));
        }
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror = function(){ resolve(dataUrl); };
    img.src = dataUrl;
  });
}

let _photoToken = 0;
function removeBackgroundSimple(dataUrl, cb){
  const token = ++_photoToken; const img = new Image(); img.crossOrigin = "anonymous";
  img.onload = function(){
    try{
      const cv = document.createElement("canvas"); cv.width = img.naturalWidth || img.width; cv.height = img.naturalHeight || img.height;
      const ctx = cv.getContext("2d", {willReadFrequently: true}); ctx.drawImage(img, 0, 0);
      const iData = ctx.getImageData(0, 0, cv.width, cv.height); const d = iData.data;
      const corners = [0, (cv.width - 1) * 4, ((cv.height - 1) * cv.width) * 4, ((cv.height - 1) * cv.width + (cv.width - 1)) * 4];
      let br = 0, bg = 0, bb = 0;
      corners.forEach(function(i){ br += d[i]; bg += d[i+1]; bb += d[i+2]; });
      br = Math.round(br / 4); bg = Math.round(bg / 4); bb = Math.round(bb / 4);
      const tol = 48;
      for(let i = 0; i < d.length; i += 4){
        const r = d[i], g = d[i+1], b = d[i+2];
        const dist = Math.sqrt((r - br) * (r - br) + (g - bg) * (g - bg) + (b - bb) * (b - bb));
        if(dist < tol || (r > 240 && g > 240 && b > 240)) d[i+3] = 0;
        else if(dist < tol + 15) d[i+3] = Math.round(d[i+3] * ((dist - tol) / 15));
      }
      ctx.putImageData(iData, 0, 0);
      if(token === _photoToken) cb(cv.toDataURL("image/png"));
    }catch(e){ if(token === _photoToken) cb(dataUrl); }
  };
  img.onerror = function(){ if(token === _photoToken) cb(dataUrl); };
  img.src = dataUrl;
}

async function removeBackgroundSmart(dataUrl){
  const useAI = document.getElementById("useAI") && document.getElementById("useAI").checked;
  if(!useAI) return new Promise(function(res){ removeBackgroundSimple(dataUrl, res); });
  try{
    const mod = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
    const blob = await mod.removeBackground(dataUrl, {output: {format: 'image/png'}});
    return new Promise(function(resolve){
      const r = new FileReader(); r.onloadend = function(){ resolve(r.result); }; r.readAsDataURL(blob);
    });
  }catch(e){
    return new Promise(function(resolve){ removeBackgroundSimple(dataUrl, resolve); });
  }
}

async function fetchComTimeout(url, opts, ms){
  const ctl = new AbortController();
  const to = setTimeout(function(){ ctl.abort(); }, ms || API_TIMEOUT_MS);
  try{
    const r = await fetch(url, Object.assign({}, opts, {signal: ctl.signal}));
    return r;
  } finally { clearTimeout(to); }
}

async function api(fn, payload, retries){
  payload = payload || {};
  if(retries === undefined) retries = (NO_RETRY_FNS.indexOf(fn) !== -1) ? 0 : 2;

  const token = getStoredToken();
  if(!token){
    toast("Inicie sessão para aceder à base de dados.","warning");
    throw new Error("Não autenticado.");
  }

  const headers = {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + token
  };

  if(_currentUser && _currentUser.email && !payload.email){
    payload.email = _currentUser.email;
  }

  try{
    const resp = await fetchComTimeout(API_URL, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({fn: fn, payload: payload})
    }, API_TIMEOUT_MS);

    const texto = await resp.text();
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    let j; try{ j = JSON.parse(texto); }catch(e){ throw new Error('Resposta inválida.'); }
    if(!j.ok) throw new Error(j.error || 'Erro no servidor');
    return j.data;
  }catch(e){
    const aborted = e && (e.name === 'AbortError' || String(e.message).indexOf('abort') >= 0);
    if(retries > 0 && !aborted){
      await new Promise(function(r){ setTimeout(r, 1200); });
      return api(fn, payload, retries - 1);
    }
    throw e;
  }
}

function fitPreviewCard(){
  const scaler = document.getElementById('previewScaler');
  const card = document.getElementById('mainLabelCard');
  if(!scaler || !card) return;
  card.style.transform = 'none'; card.style.marginBottom = '';
  void card.offsetWidth;
  const nW = card.offsetWidth || 380, nH = card.offsetHeight || 214;
  const aW = scaler.clientWidth; if(aW <= 20) return;
  const maxH = Math.max(180, Math.min(window.innerHeight * 0.55, 420));
  let scale = 1;
  if(nW > aW) scale = aW / nW;
  if(nH * scale > maxH) scale = Math.min(scale, maxH / nH);
  if(scale < 0.999){ card.style.transform = 'scale(' + scale + ')'; card.style.marginBottom = ((scale - 1) * nH) + 'px'; }
  else { card.style.transform = ''; card.style.marginBottom = ''; }
}

async function gravarCache(){
  try{
    await localforage.setItem(CACHE_KEY, {
      produtos: savedProducts,
      banco: bancoFruta,
      t: Date.now()
    });
  }catch(e){}
}

async function lerCache(){
  try{
    const c = await localforage.getItem(CACHE_KEY);
    if(!c) return false;
    if(Array.isArray(c.produtos)){ savedProducts = c.produtos.filter(function(p){ return !produtoVazio(p); }); renderDb(); }
    if(Array.isArray(c.banco)){ bancoFruta = c.banco; renderBancoFruta($("buscaBancoFruta").value); }
    setDataState('cache');
    return true;
  }catch(e){ return false; }
}

async function carregarTudo(opts){
  opts = opts || {};
  if(!opts.skipCache) await lerCache();
  if(!sessaoAindaValida()){ setDataState('cache'); return; }
  setDataState('loading');
  if(!opts.silent) setStatus("A sincronizar com o Drive…","loading");

  const [rProd, rBanco] = await Promise.all([
    api('listarProdutos').then(function(v){ return {ok: true, v: v}; }).catch(function(e){ return {ok: false, e: e.message}; }),
    api('listarBancoFruta').then(function(v){ return {ok: true, v: v}; }).catch(function(e){ return {ok: false, e: e.message}; })
  ]);

  let mudou = false;
  if(rProd.ok){
    const nova = ensureArray(rProd.v).filter(function(p){ return !produtoVazio(p); });
    if(JSON.stringify(nova) !== JSON.stringify(savedProducts)){ savedProducts = nova; mudou = true; }
  }
  if(rBanco.ok){
    const novaB = ensureArray(rBanco.v);
    if(JSON.stringify(novaB) !== JSON.stringify(bancoFruta)){ bancoFruta = novaB; mudou = true; }
  }
  if(mudou){ renderDb(); renderBancoFruta($("buscaBancoFruta").value); await gravarCache(); }

  if(!rProd.ok && !rBanco.ok){
    setDataState('offline');
    if(!opts.silent) setStatus("Sem ligação ao Drive — a usar cache.","warning", {duration: 4000});
  } else if(!rProd.ok || !rBanco.ok){
    setDataState('cache');
    if(!opts.silent) setStatus("Sincronização parcial.","warning");
  } else {
    setDataState('live');
    if(!opts.silent) setStatus("Sincronizado","success");
  }
}

function onlyDigits(v){ return String(v || "").replace(/\D/g, ""); }
function ean13CheckDigit(f12){ const d = onlyDigits(f12).slice(0, 12); if(d.length !== 12) return null; let s = 0; for(let i = 0; i < 12; i++) s += Number(d[i]) * (i % 2 === 0 ? 1 : 3); return String((10 - (s % 10)) % 10); }
function isValidEAN13(v){ const d = onlyDigits(v); return d.length === 13 && ean13CheckDigit(d.slice(0, 12)) === d[12]; }
function isValidEAN14(v){ const d = onlyDigits(v); if(d.length !== 14) return false; let s = 0; for(let i = 13, p = 0; i >= 0; i--, p++) s += Number(d[i]) * (p % 2 === 0 ? 3 : 1); return s % 10 === 0; }
function normalizeBarcode(v){ return String(v || "").trim().replace(/\s+/g, ""); }

}

const CODE128_PATTERNS = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232"];
const CODE128_STOP = "2331112", CODE128_START_B = 104;

function drawCode128(svg, text){
  const str = String(text || ''); if(!str || !/^[\x20-\x7E]+$/.test(str)) return;
  const v = [CODE128_START_B]; for(let i = 0; i < str.length; i++) v.push(str.charCodeAt(i) - 32);
  let sum = CODE128_START_B; for(let i = 0; i < str.length; i++) sum += (str.charCodeAt(i) - 32) * (i + 1);
  v.push(sum % 103); v.push(106);
  let bits = '';
  for(let k = 0; k < v.length; k++){
    const p = (v[k] === 106) ? CODE128_STOP : CODE128_PATTERNS[v[k]]; if(!p) continue;
    let b = true; for(let j = 0; j < p.length; j++){ const w = parseInt(p[j], 10); bits += (b ? '1' : '0').repeat(w); b = !b; }
  }
  const qz = 11, tw = bits.length + qz * 2, ns = "http://www.w3.org/2000/svg";
  svg.setAttribute("viewBox", "0 0 " + tw + " 72"); svg.setAttribute("preserveAspectRatio", "none");
  for(let i = 0; i < bits.length; i++){
    if(bits[i] !== "1") continue;
    const r = document.createElementNS(ns, "rect");
    r.setAttribute("x", i + qz); r.setAttribute("y", 0); r.setAttribute("width", 1); r.setAttribute("height", 62); r.setAttribute("fill", "black");
    svg.appendChild(r);
  }
}

const ITF_PATTERNS = {'0':"00110",'1':"10001",'2':"01001",'3':"11000",'4':"00101",'5':"10100",'6':"01100",'7':"00011",'8':"10010",'9':"01010"};

function drawITF14(svg, digits){
  const d = String(digits || '').replace(/\D/g, ''); if(d.length !== 14) return;
  const N = 1, W = 3; let bits = '';
  bits += '1'.repeat(N) + '0'.repeat(N) + '1'.repeat(N) + '0'.repeat(N);
  for(let i = 0; i < d.length; i += 2){
    const b = ITF_PATTERNS[d[i]], s = ITF_PATTERNS[d[i+1]];
    for(let k = 0; k < 5; k++){ bits += '1'.repeat(b[k] === '1' ? W : N); bits += '0'.repeat(s[k] === '1' ? W : N); }
  }
  bits += '1'.repeat(W) + '0'.repeat(N) + '1'.repeat(N);
  const qz = 11, tw = bits.length + qz * 2, ns = "http://www.w3.org/2000/svg";
  svg.setAttribute("viewBox", "0 0 " + tw + " 72"); svg.setAttribute("preserveAspectRatio", "none");
  for(let i = 0; i < bits.length; i++){
    if(bits[i] !== "1") continue;
    const r = document.createElementNS(ns, "rect");
    r.setAttribute("x", i + qz); r.setAttribute("y", 6); r.setAttribute("width", 1); r.setAttribute("height", 50); r.setAttribute("fill", "black");
    svg.appendChild(r);
  }
  const bt = document.createElementNS(ns, "rect"); bt.setAttribute("x", qz); bt.setAttribute("y", 0); bt.setAttribute("width", bits.length); bt.setAttribute("height", 6); bt.setAttribute("fill", "black"); svg.appendChild(bt);
  const bb = document.createElementNS(ns, "rect"); bb.setAttribute("x", qz); bb.setAttribute("y", 56); bb.setAttribute("width", bits.length); bb.setAttribute("height", 6); bb.setAttribute("fill", "black"); svg.appendChild(bb);
}

function drawBarcode(svg, value){
  if(!svg) return; svg.innerHTML = "";
  const clean = normalizeBarcode(value); if(!clean) return;
  if(/^\d{13}$/.test(clean) && isValidEAN13(clean)){
    const EL = ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
    const EG = ["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];
    const ER = ["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"];
    const EP = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
    const dg = onlyDigits(clean), f = Number(dg[0]), L = dg.slice(1, 7), R = dg.slice(7), p = EP[f];
    let bits = "101"; for(let i = 0; i < 6; i++) bits += p[i] === "L" ? EL[Number(L[i])] : EG[Number(L[i])];
    bits += "01010"; for(let i = 0; i < 6; i++) bits += ER[Number(R[i])]; bits += "101";
    const tw = bits.length + 22, ns = "http://www.w3.org/2000/svg";
    svg.setAttribute("viewBox", "0 0 " + tw + " 72"); svg.setAttribute("preserveAspectRatio", "none");
    for(let i = 0; i < bits.length; i++){
      if(bits[i] === "1"){
        const r = document.createElementNS(ns, "rect");
        r.setAttribute("x", i + 11); r.setAttribute("y", 0); r.setAttribute("width", 1); r.setAttribute("height", 62); r.setAttribute("fill", "black");
        svg.appendChild(r);
      }
    }
    return;
  }
  if(/^\d{14}$/.test(clean)){ drawITF14(svg, clean); return; }
  if(/^[\x20-\x7E]+$/.test(clean)){ drawCode128(svg, clean); }
}

function calcUnitInfo(capUnit){
  switch(capUnit){
    case "peso": return {mainSuffix:"€/KG", refSuffix:"€/KG", normalizar:1};
    case "g": return {mainSuffix:"€/UN", refSuffix:"€/KG", normalizar:1/1000};
    case "lt": return {mainSuffix:"€/LT", refSuffix:"€/LT", normalizar:1};
    case "cl": return {mainSuffix:"€/UN", refSuffix:"€/LT", normalizar:1};
    case "ml": return {mainSuffix:"€/UN", refSuffix:"€/LT", normalizar:1/1000};
    case "un": return {mainSuffix:"€/UN", refSuffix:"€/UN", normalizar:1};
    case "dz": return {mainSuffix:"€/DZ", refSuffix:"€/UN", normalizar:12};
    case "meia_dz": return {mainSuffix:"€/½DZ", refSuffix:"€/UN", normalizar:6};
    case "dose": return {mainSuffix:"€/DOSE", refSuffix:"€/DOSE", normalizar:1};
    default: return {mainSuffix:"€/KG", refSuffix:"€/KG", normalizar:1};
  }
}

function atualizarProdutoLocal(payload){
  const chave = chaveProduto(payload);
  const idx = savedProducts.findIndex(function(p){ return chaveProduto(p) === chave; });
  const novo = Object.assign({}, payload, {atualizadoEm: new Date().toISOString(), utilizador: (_currentUser && _currentUser.email) || 'utilizador'});
  if(idx >= 0) savedProducts[idx] = Object.assign({}, savedProducts[idx], novo);
  else savedProducts.push(novo);
  savedProducts = savedProducts.filter(function(p){ return !produtoVazio(p); });
}

async function resolverFotoParaPayload(d){
  let fid = d.fotoId || "", furl = d.fotoUrl || "";
  const foto = d.processedPhoto || d.originalPhoto;
  if(!foto) return {fotoId: "", fotoUrl: ""};
  if(foto.indexOf('http') === 0){
    furl = foto;
    if(!fid){ const ex = extrairFotoIdDoUrl(foto); if(ex) fid = ex; }
    return {fotoId: fid, fotoUrl: furl};
  }
  const up = await api('uploadFoto', {base64: await compressSmart(foto), nomeFicheiro: (d.internalCode || 'artigo') + '_' + Date.now() + '.jpg'});
  return {fotoId: up.id, fotoUrl: up.url};
}

window.removeFromDb = async function(i){
  const d = savedProducts[i]; if(!d){ toast("Produto não encontrado.","error"); return; }
  const nomeExib = d.nome || d.codigo || "(sem nome)";
  if(!(await confirmDialog('Eliminar "' + nomeExib + '"?'))) return;
  setStatus("A eliminar…","loading");
  const codigo = (d.codigo || '').toString().trim();
  const nome = (d.nome || '').toString().trim();
  let aviso = "";
  try{
    const r = await api('apagarProduto', {codigo: codigo, nome: nome});
    if(r && r.jaNaoExistia){ aviso = " (já não existia no Drive)"; }
  }catch(e){
    const msg = String(e && e.message || '');
    if(/não encontrado|nao encontrado|Sem produtos/i.test(msg)){
      aviso = " (era entrada órfã — removida localmente)";
    } else {
      setStatus("Erro: " + msg, "error");
      toast("Erro ao eliminar: " + msg, "error");
      return;
    }
  }
  const antes = savedProducts.length;
  savedProducts = savedProducts.filter(function(p, j){
    if(j === i) return false;
    if(produtoVazio(p) && produtoVazio(d)) return false;
    return true;
  });
  renderDb();
  await gravarCache();
  setStatus("");
  const removidos = antes - savedProducts.length;
  toast("Eliminado" + aviso + (removidos > 1 ? " (+" + (removidos - 1) + " órfãos)" : ""), "success");
  setTimeout(function(){ carregarTudo({silent: true}); }, 800);
};

function parsePrice(v){
  if(v == null || String(v).trim() === "") return null;
  let c = String(v).trim().replace(/€|\s/g, "");
  if(c.indexOf(",") > -1 && c.indexOf(".") > -1) c = c.replace(/\./g, "").replace(",", ".");
  else c = c.replace(",", ".");
  const n = Number(c); return isFinite(n) ? n : null;
}

function formatPromoDate(s, e){
  if(!s && !e) return "Preço sujeito às condições comerciais em vigor.";
  const m = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  try{
    if(s && e){
      const d1 = new Date(s), d2 = new Date(e);
      if(d1.getMonth() === d2.getMonth() && d1.getFullYear() === d2.getFullYear())
        return "Válido de " + d1.getDate() + " a " + d2.getDate() + " de " + m[d2.getMonth()] + " de " + d2.getFullYear();
      return "Válido de " + d1.getDate() + " de " + m[d1.getMonth()] + " a " + d2.getDate() + " de " + m[d2.getMonth()] + " de " + d2.getFullYear();
    } else if(e){
      const d2 = new Date(e); return "Válido até " + d2.getDate() + " de " + m[d2.getMonth()] + " de " + d2.getFullYear();
    } else {
      const d1 = new Date(s); return "Válido a partir de " + d1.getDate() + " de " + m[d1.getMonth()] + " de " + d1.getFullYear();
    }
  }catch(err){ return "Preço sujeito às condições comerciais em vigor."; }
}

function setValidationState(){
  clearFieldErrors();
  const price = parsePrice($("price").value);
  const oldPrice = parsePrice($("oldPrice").value);
  const promoPrice = parsePrice($("promoPrice").value);
  const ean = normalizeBarcode($("ean").value);
  const errors = [];
  const fv = $("presetSizes").value;
  const isFP = isFruitPromoFormat(fv);
  if($("price").value.trim() && price === null){ errors.push("O preço não é válido."); markFieldError("price", true); }
  if($("isPromoActive").checked && $("oldPrice").value.trim() && oldPrice === null){ errors.push("Preço anterior inválido."); markFieldError("oldPrice", true); }
  if($("isPromoActive").checked && !isFP && price !== null && oldPrice !== null && oldPrice <= price){ errors.push("Preço anterior deve ser superior."); markFieldError("oldPrice", true); }
  if(isFP){
    if($("promoPrice").value.trim() && promoPrice === null){ errors.push("Preço especial inválido."); markFieldError("promoPrice", true); }
    if(price !== null && promoPrice !== null && promoPrice >= price){ errors.push("Preço especial deve ser inferior."); markFieldError("promoPrice", true); }
  }
  if(ean){
    const valid = (/^\d{13}$/.test(ean) && isValidEAN13(ean)) || (/^\d{14}$/.test(ean) && isValidEAN14(ean)) || /^[\x20-\x7E]+$/.test(ean);
    if(!valid){ errors.push("Código de barras inválido."); markFieldError("ean", true); }
  }
  if(errors.length) setStatus(errors[0], "error"); else setStatus("");
}

function updateCapacityHint(){
  const h = document.getElementById("capacityHint"); if(!h) return;
  const cu = $("capacityUnit").value;
  const cn = parseFloat($("capacity").value) || 0;
  const pn = parsePrice($("price").value);
  if(cn <= 0 || pn === null){ h.style.display = "none"; return; }
  const info = calcUnitInfo(cu);
  const pu = pn / (cn * info.normalizar);
  h.textContent = "→ " + pu.toLocaleString("pt-PT", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " " + info.refSuffix;
  h.style.display = "block";
  const r = pu / pn;
  if(r > 100 || r < 0.01){ h.style.background = "#fff5e6"; h.style.borderLeftColor = "#f6c23e"; h.style.color = "#7c5a0c"; }
  else { h.style.background = "#eef4ff"; h.style.borderLeftColor = "#084298"; h.style.color = "#084298"; }
}

function _vis(el){
  if(!el) return false;
  if(el.offsetParent === null && el !== document.body) return false;
  const cs = window.getComputedStyle(el);
  if(cs.display === "none" || cs.visibility === "hidden") return false;
  return true;
}

function _overflow(p){
  if(!p) return false;
  const pr = p.getBoundingClientRect();
  if(!pr.height) return false;
  const k = p.children;
  for(let i = 0; i < k.length; i++){
    const c = k[i]; if(!_vis(c)) continue;
    const cr = c.getBoundingClientRect();
    if(cr.height === 0) continue;
    if(cr.top < pr.top - 0.5 || cr.bottom > pr.bottom + 0.5) return true;
  }
  return false;
}

function autoFitPrice(card){

function computeLayout(w, h){
  const PW = 198, PH = 285;
  w = Math.max(20, Math.min(198, Number(w) || 70));
  h = Math.max(20, Math.min(285, Number(h) || 38));
  const G = 1;
  const cols = Math.max(1, Math.floor((PW + G) / (w + G)));
  const rows = Math.max(1, Math.floor((PH + G) / (h + G)));
  return {cols: cols, rows: rows, perPage: cols * rows, gutter: G};
}

function getPrintDimensions(format, baseDims){
  if(format === "A5") return {width: 196, height: 140};
  if(format === "A6" || format === "frutaPromoA6") return {width: 138, height: 98};
  if(format === "125x80" || format === "frutaPromo125x80") return {width: 120, height: 76};
  if(format === "100x70") return {width: 96, height: 68};
  if(format === "105x38") return {width: 96, height: 36};
  if(format === "70x38") return {width: 66, height: 36};
  if(format === "65x38") return {width: 62, height: 36};
  if(!baseDims) return {width: 70, height: 38};
  return {width: Math.max(20, Math.min(198, baseDims.width || 70)), height: Math.max(20, Math.min(285, baseDims.height || 38))};
}

function construirPaginasA4(container, groups, amanhecerQueue){
  for(let i = 0; i < amanhecerQueue.length; i += 21){
    const chunk = amanhecerQueue.slice(i, i + 21);
    const wrapper = document.createElement("div"); wrapper.className = "print-page-wrapper";
    const grid = document.createElement("div"); grid.className = "print-sheet-amanhecer";
    chunk.forEach(function(data, idx){
      const dims = {width: 66, height: idx < 3 ? 38 : 40};
      const c = buildLabelClone(data, dims, true);
      c.style.setProperty("width", "66mm", "important");
      c.style.setProperty("height", (idx < 3 ? 38 : 40) + "mm", "important");
      grid.appendChild(c);
    });
    for(let j = chunk.length; j < 21; j++){
      const e = document.createElement("div");
      e.className = "label-card size-small";
      e.style.visibility = "hidden";
      e.style.setProperty("width", "66mm", "important");
      e.style.setProperty("height", (j < 3 ? 38 : 40) + "mm", "important");
      grid.appendChild(e);
    }
    wrapper.appendChild(grid); container.appendChild(wrapper);
  }
  const byDims = {};
  groups.forEach(function(g){
    if(g.format === "amanhecer") return;
    const first = g.items[0];
    const baseDims = getDimensionsFor(g.format, first.customWidth, first.customHeight);
    const dims = getPrintDimensions(g.format, baseDims);
    const key = dims.width + "x" + dims.height;
    if(!byDims[key]) byDims[key] = {width: dims.width, height: dims.height, items: []};
    g.items.forEach(function(it){ byDims[key].items.push(it); });
  });
  Object.keys(byDims).forEach(function(key){
    const o = byDims[key];
    const lay = computeLayout(o.width, o.height);
    for(let i = 0; i < o.items.length; i += lay.perPage){
      const chunk = o.items.slice(i, i + lay.perPage);
      const wrapper = document.createElement("div"); wrapper.className = "print-page-wrapper";
      const grid = document.createElement("div"); grid.className = "print-page-generic-grid";
      grid.style.gridTemplateColumns = "repeat(" + lay.cols + ", " + o.width + "mm)";
      grid.style.gridAutoRows = o.height + "mm";
      grid.style.gap = lay.gutter + "mm";
      chunk.forEach(function(d){
        const c = buildLabelClone(d, {width: o.width, height: o.height}, true);
        c.style.setProperty("width", o.width + "mm", "important");
        c.style.setProperty("height", o.height + "mm", "important");
        grid.appendChild(c);
      });
      wrapper.appendChild(grid); container.appendChild(wrapper);
    }
  });
}

function _fmtDoItem(q, ef){ return (q && q.data && (q.data.presetSizes || q.data.formato)) || ef || "amanhecer"; }
function _agruparItensPorFormato(items){
  const gr = {};
  items.forEach(function(it){
    const k = it.format || "amanhecer";
    if(!gr[k]) gr[k] = {format: k, items: []};
    gr[k].items.push(it.data);
  });
  const v = {}, o = [];
  items.forEach(function(it){
    const k = it.format || "amanhecer";
    if(v[k]) return; v[k] = true; o.push(gr[k]);
  });
  return o;
}

async function preloadImagesAsDataURLs(container){
  const imgs = Array.from(container.querySelectorAll("img"));
  await Promise.all(imgs.map(async function(img){
    const src = img.getAttribute('src') || '';
    if(!src || src.indexOf('data:') === 0) return;
    try{
      const r = await fetch(src, {mode: 'cors'});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const b = await r.blob();
      const du = await new Promise(function(res, rej){ const fr = new FileReader(); fr.onloadend = function(){ res(fr.result); }; fr.onerror = rej; fr.readAsDataURL(b); });
      img.removeAttribute('crossorigin'); img.src = du;
      await new Promise(function(res){ if(img.complete && img.naturalWidth > 0) return res(); img.onload = res; img.onerror = res; setTimeout(res, 4000); });
    }catch(e){}
  }));
}

async function gerarPDFBlob(){
  await loadHtml2CanvasPro(); await loadJsPDF();
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit: 'mm', format: 'a4', orientation: 'portrait', compress: true});
  const ef = $("presetSizes").value;
  const items = [];
  if(printQueue.length === 0){
    const c = Math.max(1, Math.min(100, Number($("copiesCount").value) || 1));
    for(let i = 0; i < c; i++) items.push({data: getFormData(), format: ef});
  } else {
    printQueue.forEach(function(q){
      const f = _fmtDoItem(q, ef);
      for(let i = 0; i < q.copies; i++) items.push({data: q.data, format: f});
    });
  }
  if(items.length === 0) throw new Error("Sem etiquetas.");
  const groups = _agruparItensPorFormato(items);
  const aq = [];
  groups.forEach(function(g){ if(g.format === "amanhecer") g.items.forEach(function(d){ aq.push(d); }); });
  const rz = document.createElement("div");
  rz.style.cssText = "position:absolute;top:0;left:-10000px;width:250mm;background:#fff;padding:0;margin:0;z-index:1;overflow:visible;pointer-events:none;";
  document.body.appendChild(rz);
  async function rl(el){
    el.style.transform = "none"; el.style.position = "relative"; el.style.display = "flex";
    el.style.boxSizing = "border-box"; el.style.boxShadow = "none"; el.style.borderRadius = "0";
    el.style.border = "1px solid #222"; el.style.margin = "0"; el.style.visibility = "visible"; el.style.opacity = "1";
    rz.appendChild(el);
    try{ await preloadImagesAsDataURLs(el); }catch(e){}
    const pe = el.querySelector(".product"); if(pe) autoFitTextSync(pe);
    autoFitPrice(el);
    if(el.classList.contains("has-image")) autoAdaptImage(el);
    await new Promise(function(r){ requestAnimationFrame(function(){ setTimeout(r, 60); }); });
    const w = el.offsetWidth || 250, h = el.offsetHeight || 144;
    const cv = await window.html2canvas(el, {scale: 3, backgroundColor: '#ffffff', useCORS: true, allowTaint: true, logging: false, imageTimeout: 0, width: w, height: h, windowWidth: w, windowHeight: h});
    const du = cv.toDataURL('image/jpeg', 0.92);
    rz.removeChild(el);
    return du;
  }
  let fp = true;
  const ARH = [38, 40, 40, 40, 40, 40, 40];
  const ACW = 66;
  const OFF = 6;
  const BL = OFF + (198 - ACW * 3) / 2;
  const BT = OFF;
  for(let i = 0; i < aq.length; i += 21){
    const ch = aq.slice(i, i + 21);
    if(!fp) doc.addPage(); fp = false;
    let y = BT + (offsetY || 0);
    for(let r = 0; r < 7; r++){
      const rh = ARH[r], yr = y; y += rh;
      for(let c = 0; c < 3; c++){
        const idx = r * 3 + c; if(idx >= ch.length) break;
        const x = BL + c * ACW + (offsetX || 0);
        const data = ch[idx];
        const el = buildLabelClone(data, {width: 66, height: rh}, true);
        el.style.width = "66mm"; el.style.height = rh + "mm"; el.style.boxSizing = "border-box"; el.style.overflow = "hidden";
        if(c === 0){ const ml = Math.max(0, marginLeft || 0); if(ml > 0) el.style.setProperty("padding-left", ml + "mm", "important"); }
        if(c === 2){ const mr = Math.max(0, marginRight || 0); if(mr > 0) el.style.setProperty("padding-right", mr + "mm", "important"); }
        const du = await rl(el);
        doc.addImage(du, 'JPEG', x, yr, 66, rh);
      }
    }
  }
  const byDims = {};
  groups.forEach(function(g){
    if(g.format === "amanhecer") return;
    const first = g.items[0];
    const bd = getDimensionsFor(g.format, first.customWidth, first.customHeight);
    const dd = getPrintDimensions(g.format, bd);
    const k = dd.width + "x" + dd.height;
    if(!byDims[k]) byDims[k] = {width: dd.width, height: dd.height, items: []};
    g.items.forEach(function(it){ byDims[k].items.push(it); });
  });
  for(const k in byDims){
    const o = byDims[k];
    const lay = computeLayout(o.width, o.height);
    const G = lay.gutter;
    for(let p = 0; p < o.items.length; p += lay.perPage){
      const ch = o.items.slice(p, p + lay.perPage);
      if(!fp) doc.addPage(); fp = false;
      const tw = lay.cols * o.width + (lay.cols - 1) * G;
      const sx = (210 - tw) / 2 + (offsetX || 0);
      const sy = 6 + (offsetY || 0);
      for(let idx = 0; idx < ch.length; idx++){
        const r = Math.floor(idx / lay.cols), c = idx % lay.cols;
        const x = sx + c * (o.width + G), y = sy + r * (o.height + G);
        const data = ch[idx];
        const el = buildLabelClone(data, {width: o.width, height: o.height}, true);
        el.style.width = o.width + "mm"; el.style.height = o.height + "mm"; el.style.boxSizing = "border-box"; el.style.overflow = "hidden";
        const du = await rl(el);
        doc.addImage(du, 'JPEG', x, y, o.width, o.height);
      }
    }
  }
  document.body.removeChild(rz);
  return doc.output('blob');
}

function blobToBase64(blob){
  return new Promise(function(resolve, reject){
    const r = new FileReader(); r.onloadend = function(){ resolve(r.result); }; r.onerror = reject; r.readAsDataURL(blob);
  });
}

async function enviarEtiquetasPorEmail(){
  if(_emailSending){ toast("Envio em curso.","warning"); return; }

  if(printQueue.length === 0) n = Math.max(1, Math.min(100, Number($("copiesCount").value) || 1));
  else printQueue.forEach(function(q){ n += q.copies; });
  if(n > 45){ toast("Limite 45 etiquetas por envio.","error", 8000); return; }
  const info = await pedirEmail(); if(!info) return;
  _emailSending = true;
  const btn = $("emailLabelsBtn"); const bt = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = "⏳ A enviar…"; }
  try{

    let blob;
    try{ blob = await gerarPDFBlob(); }
    catch(e){ setStatus("Erro PDF: " + e.message, "error"); toast("Erro ao gerar PDF","error"); return; }
    if(!blob || blob.size < 500){ setStatus("PDF vazio.","error"); return; }
    setStatus("A converter…","loading");
    let b64;
    try{ b64 = await blobToBase64(blob); }catch(e){ setStatus("Erro: " + e.message, "error"); return; }
    setStatus("A enviar para " + info.destino + "…","loading");
    try{
      await api('enviarEtiquetasEmail', {

      });

    }catch(e){ setStatus("Erro email: " + e.message, "error"); toast("Erro ao enviar email","error"); }
  } finally {
    _emailSending = false;
    if(btn){ btn.disabled = false; btn.textContent = bt || "📧 Enviar etiquetas por Email (PDF)"; }
  }
}

let scanner = null;
let _qrLoading = null;
function loadQrCodeLib(){
  if(typeof Html5Qrcode !== 'undefined') return Promise.resolve();
  if(_qrLoading) return _qrLoading;
  _qrLoading = new Promise(function(resolve, reject){
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload = function(){ _qrLoading = null; resolve(); };
    s.onerror = function(){ _qrLoading = null; reject(new Error('Falha leitor')); };
    document.head.appendChild(s);
  });
  return _qrLoading;
}

$("previewSheetBtn").addEventListener("click", function(){
  const content = $("sheetPreviewContent"); content.innerHTML = "";
  const ef = $("presetSizes").value;
  const items = [];
  if(printQueue.length === 0){
    const c = Math.max(1, Math.min(21, Number($("copiesCount").value) || 1));
    for(let i = 0; i < c; i++) items.push({data: getFormData(), format: ef});
  } else {
    printQueue.forEach(function(q){
      const f = _fmtDoItem(q, ef);
      for(let i = 0; i < q.copies; i++) items.push({data: q.data, format: f});
    });
  }
  if(items.length === 0){ toast("Sem etiquetas.","warning"); return; }
  const groups = _agruparItensPorFormato(items);
  let tp = 0;
  groups.forEach(function(g){
    if(g.format === "amanhecer"){
      for(let i = 0; i < g.items.length; i += 21){
        const ch = g.items.slice(i, i + 21);
        const page = document.createElement("div"); page.className = "preview-page-amanhecer";
        ch.forEach(function(d, idx){
          const dims = {width: 66, height: idx < 3 ? 38 : 40};
          const cl = buildLabelClone(d, dims, true);
          cl.style.width = "66mm"; cl.style.height = idx < 3 ? "38mm" : "40mm";
          page.appendChild(cl);
        });
        for(let j = ch.length; j < 21; j++){
          const e = document.createElement("div"); e.className = "label-card size-small empty"; page.appendChild(e);
        }
        content.appendChild(page);
        page.querySelectorAll(".label-card:not(.empty)").forEach(function(c){ reAdaptClone(c); });
        tp += ch.length;
      }
    } else {
      const first = g.items[0];
      const bd = getDimensionsFor(g.format, first.customWidth, first.customHeight);
      const dd = getPrintDimensions(g.format, bd);
      const lay = computeLayout(dd.width, dd.height);
      const grp = document.createElement("div"); grp.className = "preview-group-flex";
      const page = document.createElement("div");
      page.style.display = "grid";
      page.style.gridTemplateColumns = "repeat(" + lay.cols + ", " + (dd.width * 3.2) + "px)";
      page.style.gap = (lay.gutter * 3.2) + "px";
      g.items.forEach(function(d){
        const cl = buildLabelClone(d, dd, true);
        cl.style.width = (dd.width * 3.2) + "px"; cl.style.height = (dd.height * 3.2) + "px";
        page.appendChild(cl);
      });
      grp.appendChild(page); content.appendChild(grp);
      grp.querySelectorAll(".label-card").forEach(function(c){ reAdaptClone(c); });
      tp += g.items.length;
    }
  });
  $("sheetPreviewTitle").textContent = "👁️ Pré-visualização (" + tp + " etiqueta" + (tp > 1 ? "s" : "") + ")";
  $("sheetPreview").classList.add("show");
});
