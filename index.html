<!DOCTYPE html>
<html lang="pt-PT" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c8102e">
    <title>Etiquetas Pro - Balcão Agrícola</title>
    
    <!-- Bibliotecas Base -->
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --red: #c8102e; --red-dark: #a80d24; --bg: #f0f2f5; --panel: #ffffff;
            --text: #1a1f28; --text-soft: #64748b; --border: #e2e8f0;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); 
            color: var(--text); margin: 0; padding: 0; line-height: 1.5;
        }

        /* HEADER */
        .top-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 8000;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); padding-top: var(--safe-top);
        }
        .header-inner {
            max-width: 1200px; margin: 0 auto; padding: 12px 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; text-transform: uppercase; }
        .brand img { height: 32px; }

        /* LAYOUT PRINCIPAL */
        .app-container { 
            max-width: 1200px; margin: 90px auto 100px; padding: 0 20px;
            display: grid; grid-template-columns: 450px 1fr; gap: 30px;
        }

        /* SISTEMA DE ABAS (TABS) */
        .tabs-nav {
            display: flex; gap: 4px; background: #fff; padding: 6px; 
            border-radius: 14px; margin-bottom: 15px; border: 1px solid var(--border);
            position: sticky; top: 85px; z-index: 500;
        }
        .tab-btn {
            flex: 1; padding: 12px 5px; border: none; background: transparent; 
            border-radius: 10px; font-weight: 800; font-size: 11px; color: var(--text-soft);
            cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .tab-btn.active { background: var(--red); color: #fff; box-shadow: 0 4px 12px rgba(200,16,46,0.2); }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }

        /* PAINÉIS E INPUTS */
        .panel { background: var(--panel); border-radius: 16px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 800; color: var(--text-soft); margin-bottom: 6px; text-transform: uppercase; }
        input, select, textarea { 
            width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px;
            font-size: 15px; margin-bottom: 15px; background: #fafbfc;
        }
        input:focus { border-color: var(--red); outline: none; background: #fff; }
        .uppercase-input { text-transform: uppercase; }

        /* BOTÕES */
        button { 
            cursor: pointer; border: none; border-radius: 12px; font-weight: 800; 
            transition: 0.2s; padding: 14px; width: 100%; font-size: 14px;
        }
        button:active { transform: scale(0.97); }
        .primary { background: linear-gradient(135deg, var(--red), var(--red-dark)); color: #fff; }
        .secondary { background: #f0f2f5; color: var(--text); border: 1px solid var(--border); }
        .success-btn { background: #1e8a4a; color: #fff; }

        /* PREVIEW DESKTOP */
        .preview-sticky { position: sticky; top: 85px; display: flex; flex-direction: column; align-items: center; }
        .label-card { 
            background: #fff; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 380px; height: 214px; position: relative; overflow: hidden; padding: 5px;
        }

        /* BARRA FIXA MOBILE */
        .mobile-sticky-bar {
            display: none; position: fixed; bottom: 0; left: 0; right: 0;
            background: #fff; padding: 12px 16px; box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            z-index: 8500; border-top: 1px solid var(--border); padding-bottom: calc(12px + var(--safe-bottom));
        }
        .sticky-info strong { display: block; font-size: 14px; color: var(--text-soft); }
        .sticky-info span { font-size: 18px; font-weight: 900; color: var(--red); }

        /* MODAIS */
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); 
            z-index: 9999; align-items: center; justify-content: center; padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-content { background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-width: 500px; }
        
        @media (max-width: 900px) {
            .app-container { grid-template-columns: 1fr; margin-top: 130px; }
            .preview-sticky { display: none; }
            .mobile-sticky-bar { display: flex; align-items: center; justify-content: space-between; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header class="top-header">
    <div class="header-inner">
        <div class="brand">
            <img src="https://lh3.googleusercontent.com/d/1vxBDfH2Z4y8PjWGktv_58alk07mK6ugO" alt="Logo">
            <span>Etiquetas Pro</span>
        </div>
        <div id="g_id_onload"
             data-client_id="268940510478-ko2qq87rmqsa1vn9qq8uci5aq50ofvvi.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"></div>
        <div class="g_id_signin" data-type="standard" data-shape="pill"></div>
    </div>
</header>

<div class="app-container">
    <div class="left-col">
        <!-- Navegação por Abas -->
        <nav class="tabs-nav">
            <button class="tab-btn active" onclick="openTab('t-prod')">📦<span>Produto</span></button>
            <button class="tab-btn" onclick="openTab('t-preco')">💰<span>Preço</span></button>
            <button class="tab-btn" onclick="openTab('t-foto')">🖼️<span>Foto</span></button>
            <button class="tab-btn" onclick="openTab('t-fila')">🖨️<span>Fila</span></button>
        </nav>

        <!-- ABA 1: PRODUTO -->
        <div id="t-prod" class="tab-content active">
            <div class="panel">
                <label>Formato</label>
                <select id="presetSizes" onchange="updateCard()">
                    <option value="amanhecer">Amanhecer (70x38)</option>
                    <option value="125x80">Suporte Fruta (125x80)</option>
                    <option value="A6">Tabuleta A6 (148x105)</option>
                    <option value="custom">Personalizado...</option>
                </select>
                <label>Loja</label>
                <select id="store" onchange="updateCard()">
                    <option value="PATAIAS">Pataias</option>
                    <option value="GARCIA">Garcia</option>
                </select>
                <label>Código Interno</label>
                <input id="internalCode" type="text" class="uppercase-input" placeholder="Ex: 1234">
                <label>Nome do Artigo</label>
                <input id="product" type="text" class="uppercase-input" placeholder="Ex: MAÇÃ GALA">
                <label>Código de Barras (EAN)</label>
                <input id="ean" type="text" placeholder="EAN13 / EAN14">
                <button class="secondary" onclick="openScanner()">📷 Ler Código</button>
            </div>
        </div>

        <!-- ABA 2: PREÇO -->
        <div id="t-preco" class="tab-content">
            <div class="panel">
                <label>Preço de Venda (€)</label>
                <input id="price" type="text" inputmode="decimal" placeholder="0,00" oninput="updateCard()">
                
                <label style="display:flex; align-items:center; gap:10px; margin: 20px 0">
                    <input type="checkbox" id="isPromoActive" onchange="togglePromo()"> 💡 Ativar Promoção
                </label>

                <div id="promoBox" style="display:none">
                    <label>Preço Anterior (€)</label>
                    <input id="oldPrice" type="text" placeholder="0,00" oninput="updateCard()">
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
                    <div>
                        <label>Quantidade</label>
                        <input id="capacity" type="number" step="0.001" oninput="updateCard()">
                    </div>
                    <div>
                        <label>Unidade</label>
                        <select id="capacityUnit" onchange="updateCard()">
                            <option value="peso">Quilo (KG)</option>
                            <option value="un">Unidade (UN)</option>
                            <option value="lt">Litro (LT)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- ABA 3: FOTO -->
        <div id="t-foto" class="tab-content">
            <div class="panel">
                <label>Escolher Imagem</label>
                <input id="photo" type="file" accept="image/*">
                <button class="primary" style="margin-bottom:10px" onclick="openCamera()">📸 Tirar Foto Agora</button>
                <button class="secondary" onclick="abrirBanco()">🍎 Banco de Imagens</button>
                
                <label style="display:flex; align-items:center; gap:10px; margin-top:20px">
                    <input type="checkbox" id="autoRemoveBg" checked> ✨ Remover fundo automático
                </label>
            </div>
        </div>

        <!-- ABA 4: FILA -->
        <div id="t-fila" class="tab-content">
            <div class="panel">
                <label>Nº de Etiquetas</label>
                <input id="copiesCount" type="number" value="1">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
                    <button class="success-btn" onclick="addToQueue()">➕ Add Fila</button>
                    <button class="primary" onclick="saveToDb()">💾 Guardar BD</button>
                </div>
                <button class="primary" id="printBtn" style="margin-top:15px; height:60px; font-size:18px" onclick="triggerPrint()">🖨️ IMPRIMIR TUDO</button>
            </div>
            <div id="queueList"></div>
        </div>
    </div>

    <!-- PREVIEW DESKTOP -->
    <div class="preview-sticky">
        <div class="label-card" id="mainLabelCard">
            <!-- Estrutura interna da etiqueta -->
            <div style="display:flex; justify-content:space-between; border-bottom:2px solid var(--red); padding-bottom:2px">
                <span id="cardStore" style="font-size:10px; font-weight:900">PATAIAS</span>
                <span id="cardCode" style="font-size:10px; font-weight:700"></span>
            </div>
            <div style="display:grid; grid-template-columns: 1.2fr 1fr; gap:10px; margin-top:10px">
                <div>
                    <div id="cardProduct" style="font-size:18px; font-weight:900; line-height:1.1">PRODUTO</div>
                    <div id="cardUnitPrice" style="font-size:11px; color:var(--red); margin-top:5px"></div>
                </div>
                <div style="text-align:right">
                    <div id="cardOldPrice" style="text-decoration:line-through; font-size:12px; color:#666"></div>
                    <div id="cardPrice" style="font-size:38px; font-weight:900; line-height:1">0,00€</div>
                </div>
            </div>
            <div id="cardPhotoBox" style="position:absolute; bottom:5px; right:5px; width:100px; height:100px; display:none">
                <img id="cardPhotoImg" style="width:100%; height:100%; object-fit:contain">
            </div>
        </div>
    </div>
</div>

<!-- BARRA FIXA MOBILE -->
<div class="mobile-sticky-bar">
    <div class="sticky-info">
        <strong id="stickyName">NOME DO PRODUTO</strong>
        <span id="stickyPrice">0,00€</span>
    </div>
    <button class="primary" style="width:auto; padding:0 20px" onclick="abrirPreviewModal()">👁️ VER</button>
</div>

<!-- MODAL CROPPER -->
<div class="modal" id="cropModal">
    <div class="modal-content">
        <h3 style="margin:0 0 15px">📐 Ajustar Foto</h3>
        <div style="background:#000; border-radius:8px; overflow:hidden">
            <img id="imageToCrop" style="max-width:100%">
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px">
            <button class="primary" id="confirmCrop">Aplicar</button>
            <button class="secondary" id="cancelCrop">Cancelar</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://balcao-api.rh-gasparnovo.workers.dev/";
    let globalOriginalPhoto = "", globalProcessedPhoto = "", printQueue = [];

    // --- SISTEMA DE ABAS ---
    function openTab(id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function togglePromo() {
        const isP = document.getElementById("isPromoActive").checked;
        document.getElementById("promoBox").style.display = isP ? "block" : "none";
        updateCard();
    }

    // --- CARREGAMENTO DE LIBS (LAZY) ---
    async function loadLib(url, type) {
        return new Promise(res => {
            const el = document.createElement(type === 'js' ? 'script' : 'link');
            if(type === 'js') { el.src = url; el.onload = res; }
            else { el.rel = 'stylesheet'; el.href = url; res(); }
            document.head.appendChild(el);
        });
    }

    // --- EDITOR DE CORTE (CROP) ---
    async function iniciarCorte(imgSrc) {
        await loadLib("https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css", 'css');
        await loadLib("https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js", 'js');
        
        const modal = document.getElementById("cropModal");
        const img = document.getElementById("imageToCrop");
        img.src = imgSrc;
        modal.classList.add("show");

        const cropper = new Cropper(img, { aspectRatio: 1, viewMode: 1 });

        document.getElementById("confirmCrop").onclick = async () => {
            const canvas = cropper.getCroppedCanvas({ width: 800, height: 800 });
            globalOriginalPhoto = canvas.toDataURL("image/jpeg", 0.9);
            modal.classList.remove("show");
            cropper.destroy();

            if(document.getElementById("autoRemoveBg").checked) {
                toast("A remover fundo...", "info");
                // Aqui chamaria a sua função removeBackgroundSmart existente
                // globalProcessedPhoto = await removeBackgroundSmart(globalOriginalPhoto);
            }
            updateCard();
        };

        document.getElementById("cancelCrop").onclick = () => {
            modal.classList.remove("show");
            cropper.destroy();
        };
    }

    // --- ATUALIZAÇÃO DA INTERFACE ---
    function updateCard() {
        const nome = document.getElementById("product").value || "NOME DO PRODUTO";
        const preco = document.getElementById("price").value || "0,00";
        const store = document.getElementById("store").value;

        // Preview Desktop
        document.getElementById("cardProduct").textContent = nome.toUpperCase();
        document.getElementById("cardPrice").textContent = preco + "€";
        document.getElementById("cardStore").textContent = store;

        // Preview Mobile (Sticky)
        document.getElementById("stickyName").textContent = nome.toUpperCase();
        document.getElementById("stickyPrice").textContent = preco + "€";

        // Foto
        const foto = globalProcessedPhoto || globalOriginalPhoto;
        if(foto) {
            document.getElementById("cardPhotoBox").style.display = "block";
            document.getElementById("cardPhotoImg").src = foto;
        }
    }

    // Evento de Upload
    document.getElementById("photo").onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => iniciarCorte(ev.target.result);
        reader.readAsDataURL(file);
    };

    // --- COMUNICAÇÃO API ---
    async function api(fn, payload) {
        const token = localStorage.getItem("balcao_jwt");
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ fn, payload })
            });
            const j = await res.json();
            if(!j.ok) throw new Error(j.error);
            return j.data;
        } catch(e) {
            toast(e.message, "error");
            throw e;
        }
    }

    function toast(msg, type) {
        console.log(`[${type}] ${msg}`);
        // Implemente o seu sistema de toast aqui
    }

    // Inicialização
    window.onload = () => {
        updateCard();
    };
</script>

</body>
</html>
