<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Etiquetas Pro - Balcão Agrícola</title>
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* Estilos base para garantir que nada fica invisível */
        :root { --red: #c8102e; --bg: #f0f2f5; --border: #d7d7d7; }
        body { font-family: Arial, sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; }
        .app { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 450px 1fr; gap: 20px; }
        
        .tabs-nav { display: flex; gap: 5px; margin-bottom: 15px; position: sticky; top: 0; background: var(--bg); z-index: 1000; padding: 10px 0; }
        .tab-btn { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-weight: bold; cursor: pointer; background: #fff; }
        .tab-btn.active { background: var(--red); color: white; border-color: var(--red); }
        
        .tab-content { display: none; background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .tab-content.active { display: block; }
        
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #666; }
        
        .primary { background: var(--red); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
        .secondary { background: #eee; color: #333; border: 1px solid #ccc; padding: 10px; border-radius: 8px; cursor: pointer; }

        .preview-container { position: sticky; top: 20px; }
        .label-card { background: white; border: 1px solid #333; width: 380px; height: 214px; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* Barra Mobile */
        .mobile-sticky-bar { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px; border-top: 1px solid #ddd; z-index: 9999; }
        @media (max-width: 900px) {
            .app { grid-template-columns: 1fr; }
            .preview-container { display: none; }
            .mobile-sticky-bar { display: flex; justify-content: space-between; align-items: center; }
        }
        
        /* Modal Crop */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; }
    </style>
</head>
<body>

<div class="app">
    <div class="left-col">
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="openTab(event, 't-prod')">Produto</button>
            <button class="tab-btn" onclick="openTab(event, 't-preco')">Preço</button>
            <button class="tab-btn" onclick="openTab(event, 't-foto')">Foto</button>
            <button class="tab-btn" onclick="openTab(event, 't-fila')">Imprimir</button>
        </div>

        <div id="t-prod" class="tab-content active">
            <label>Formato</label>
            <select id="presetSizes" onchange="updateCard()">
                <option value="amanhecer">Amanhecer (70x38)</option>
                <option value="125x80">Suporte (125x80)</option>
            </select>
            <label>Nome do Artigo</label>
            <input id="product" type="text" oninput="updateCard()" placeholder="Ex: MAÇÃ GALA">
            <label>Código Interno</label>
            <input id="internalCode" type="text" oninput="updateCard()">
            <label>Código de Barras</label>
            <input id="ean" type="text" oninput="updateCard()">
        </div>

        <div id="t-preco" class="tab-content">
            <label>Preço de Venda (€)</label>
            <input id="price" type="text" inputmode="decimal" oninput="updateCard()" placeholder="0,00">
            <label>Quantidade/Capacidade</label>
            <input id="capacity" type="text" oninput="updateCard()">
            <label>Unidade</label>
            <select id="capacityUnit" onchange="updateCard()">
                <option value="peso">KG</option>
                <option value="un">UN</option>
            </select>
        </div>

        <div id="t-foto" class="tab-content">
            <label>Foto do Produto</label>
            <input id="photo" type="file" accept="image/*">
            <button class="primary" onclick="alert('Funcionalidade de câmera ativa no botão de arquivo')">📷 Use o botão acima</button>
        </div>

        <div id="t-fila" class="tab-content">
            <label>Nº de Etiquetas</label>
            <input id="copiesCount" type="number" value="1">
            <button class="primary" onclick="alert('A preparar impressão...')">🖨️ IMPRIMIR TUDO</button>
        </div>
    </div>

    <div class="preview-container">
        <div class="label-card" id="mainLabelCard">
            <div id="cardStore" style="font-weight: bold; font-size: 12px; border-bottom: 1px solid red;">PATAIAS</div>
            <div id="cardProduct" style="font-size: 20px; font-weight: bold; margin-top: 10px;">NOME DO PRODUTO</div>
            <div id="cardPrice" style="font-size: 40px; font-weight: bold; text-align: right; margin-top: 10px;">0,00€</div>
            <img id="cardPhotoImg" style="width: 100px; height: 100px; float: right; object-fit: contain; display:none;">
        </div>
    </div>
</div>

<div class="mobile-sticky-bar">
    <div class="sticky-info">
        <strong id="stickyName">PRODUTO</strong>
        <span id="stickyPrice">0,00€</span>
    </div>
    <button class="primary" style="width: auto; padding: 10px 20px;">VER</button>
</div>

<!-- Modal de Corte -->
<div class="modal" id="cropModal">
    <div class="modal-content">
        <h3>Ajustar Foto</h3>
        <div style="background: #000; height: 300px;"><img id="imageToCrop" style="max-width: 100%; max-height: 100%;"></div>
        <button class="primary" id="confirmCrop" style="margin-top: 10px;">Aplicar</button>
    </div>
</div>

<script>
    // --- LÓGICA DE NAVEGAÇÃO (FIXED) ---
    function openTab(evt, tabId) {
        let contents = document.getElementsByClassName("tab-content");
        for (let i = 0; i < contents.length; i++) contents[i].style.display = "none";
        
        let buttons = document.getElementsByClassName("tab-btn");
        for (let i = 0; i < buttons.length; i++) buttons[i].classList.remove("active");
        
        document.getElementById(tabId).style.display = "block";
        evt.currentTarget.classList.add("active");
    }

    // --- ATUALIZAÇÃO DO CARD ---
    function updateCard() {
        const product = document.getElementById("product").value || "NOME DO PRODUTO";
        const price = document.getElementById("price").value || "0,00";
        
        document.getElementById("cardProduct").textContent = product.toUpperCase();
        document.getElementById("cardPrice").textContent = price + "€";
        
        document.getElementById("stickyName").textContent = product.toUpperCase();
        document.getElementById("stickyPrice").textContent = price + "€";
    }

    // --- LOGIN E API (Placeholder para não travar o site) ---
    async function handleCredentialResponse(response) {
        console.log("Login recebido");
        localStorage.setItem("balcao_jwt", "sessao_permanente_balcao_2026_valida");
        alert("Sessão Iniciada!");
    }

    // Inicializar o site
    window.onload = () => {
        document.getElementById("t-prod").style.display = "block";
        updateCard();
    };
</script>

</body>
</html>
